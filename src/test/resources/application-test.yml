# 테스트 전용 MariaDB. 비밀번호는 scripts/setup-test-db.ps1이 만든 로컬 파일이나 환경 변수에서 읽는다.
spring:
  config:
    import: optional:file:./test-db.local.properties
  datasource:
    url: ${TEST_DB_URL:jdbc:mariadb://localhost:3306/appdb_test}
    username: ${TEST_DB_USERNAME:apptest}
    password: ${TEST_DB_PASSWORD:}

app:
  intake-scheduler:
    enabled: false
